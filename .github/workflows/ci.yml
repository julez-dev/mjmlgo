name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned so a lint failure is reproducible and not caused by a tool upgrade.
  STATICCHECK_VERSION: "2026.2.2"
  GOPLS_VERSION: "v0.24.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # The parity tests render every fixture with the reference MJML CLI, whose
      # version is pinned in package.json.
      - name: Install reference MJML
        run: npm ci

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          "$(go env GOPATH)/bin/staticcheck" ./...

      # gopls carries analyzers staticcheck does not have (`writestring`, the
      # modernize passes behind "use maps.Copy", "could use tagged switch", ...).
      # Those land at hint severity, which `gopls check` filters out by default,
      # so severity is lowered to hint on purpose. It exits 0 even when it
      # reports, which makes its output the gate.
      - name: gopls check
        run: |
          go install "golang.org/x/tools/gopls@${GOPLS_VERSION}"
          diagnostics=$("$(go env GOPATH)/bin/gopls" check -severity=hint $(git ls-files '*.go'))
          if [ -n "$diagnostics" ]; then
            echo "$diagnostics"
            exit 1
          fi

      - name: Tests (unit, parity against MJML, invalid input)
        run: go test ./... -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic

      - name: Coverage report (not a gate)
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Fuzz smoke test (parser)
        run: go test ./ -run '^$' -fuzz FuzzParse -fuzztime 30s .

      - name: Fuzz smoke test (renderer)
        run: go test ./ -run '^$' -fuzz FuzzRenderMJML -fuzztime 30s .
